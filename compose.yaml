services:
  paper:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      MEMORY: 6G
      USE_AIKAR_FLAGS: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?set a strong secret}
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 3
